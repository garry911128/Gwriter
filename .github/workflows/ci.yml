name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

env:
  GO_VERSION: "1.25"
  NODE_VERSION: "22"
  MIGRATE_VERSION: v4.17.1
  MYSQL_ROOT_PASSWORD: password
  MYSQL_DATABASE: gwriter_test
  # 僅供 CI 使用的測試金鑰，與任何實際部署無關。
  JWT_SECRET: ci-only-secret-value-at-least-32-bytes-long

jobs:
  backend-unit:
    name: Backend · unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: |
          go vet ./...
          go vet -tags=integration ./...

      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: backend

      - name: go test
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic

      # TS-01：門檻設在實測值稍下方，作為防退步的棘輪。
      - name: Enforce coverage floor
        run: |
          total=$(go tool cover -func=coverage.out | tail -n 1 | awk '{print $3}' | tr -d '%')
          echo "backend statement coverage: ${total}%" >> "$GITHUB_STEP_SUMMARY"
          awk -v t="$total" 'BEGIN { if (t+0 < 70) { print "coverage " t "% is below the 70% floor"; exit 1 } }'

  backend-integration:
    name: Backend · integration (real MySQL)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: gwriter_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ppassword"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Install golang-migrate
        run: |
          curl -sSL "https://github.com/golang-migrate/migrate/releases/download/${MIGRATE_VERSION}/migrate.linux-amd64.tar.gz" \
            | tar xz migrate
          sudo mv migrate /usr/local/bin/

      - name: Apply migrations
        run: |
          migrate -path db/migrations \
            -database "mysql://root:${MYSQL_ROOT_PASSWORD}@tcp(127.0.0.1:3306)/${MYSQL_DATABASE}?multiStatements=true" up

      - name: go test -tags=integration
        working-directory: backend
        env:
          TEST_DATABASE_URL: root:password@tcp(127.0.0.1:3306)/gwriter_test
        run: go test -tags=integration ./... -run Integration -v

  frontend-unit:
    name: Frontend · lint + typecheck + unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx tsc -b
      - run: npm run lint
      - run: npm run format:check

      # TS-08：覆蓋率門檻寫在 vite.config.ts 的 coverage.thresholds
      - run: npm run test:coverage

      - run: npm run build

      # PF-07：產物大小超標時要在合併前就知道，而不是使用者先感覺到慢。
      - name: Enforce bundle size budget
        run: |
          budget=200000
          total=0
          for f in dist/assets/*.js; do
            size=$(gzip -c "$f" | wc -c)
            echo "$(basename "$f"): $size bytes gzipped"
            total=$((total + size))
          done
          echo "total JS: ${total} bytes gzipped (budget ${budget})" >> "$GITHUB_STEP_SUMMARY"
          if [ "$total" -gt "$budget" ]; then
            echo "bundle exceeds the ${budget}-byte budget"; exit 1
          fi

      # SEC-11：生產相依不得帶有 high/critical 漏洞。
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: E2E · Playwright against the real stack
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: gwriter_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ppassword"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install golang-migrate
        run: |
          curl -sSL "https://github.com/golang-migrate/migrate/releases/download/${MIGRATE_VERSION}/migrate.linux-amd64.tar.gz" \
            | tar xz migrate
          sudo mv migrate /usr/local/bin/

      # E2E 自行註冊帳號，所以不需要 seed 使用者。
      - name: Apply migrations
        run: |
          migrate -path db/migrations \
            -database "mysql://root:${MYSQL_ROOT_PASSWORD}@tcp(127.0.0.1:3306)/${MYSQL_DATABASE}?multiStatements=true" up

      # 真的 Ollama 要拉好幾 GB 的模型，而且輸出不確定會讓測試 flaky，改用固定回應的 stub。
      - name: Start Ollama stub
        run: |
          node scripts/ollama-stub.mjs 11435 &
          for i in $(seq 30); do
            curl -sf -X POST http://127.0.0.1:11435/api/chat -d '{}' >/dev/null && break
            sleep 1
          done

      - name: Start backend
        env:
          DATABASE_URL: root:password@tcp(127.0.0.1:3306)/gwriter_test
          OLLAMA_URL: http://127.0.0.1:11435
          OLLAMA_MODEL: e2e-stub
          CORS_ALLOWED_ORIGIN: http://localhost:4173
        run: |
          (cd backend && go build -o /tmp/gwriter-backend .)
          /tmp/gwriter-backend &
          for i in $(seq 30); do
            curl -sf http://127.0.0.1:8080/health && break
            sleep 1
          done

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build and serve frontend
        working-directory: frontend
        env:
          VITE_API_BASE: http://localhost:8080/api/v1
        run: |
          npm run build
          npx vite preview --port 4173 --strictPort &
          for i in $(seq 30); do
            curl -sf http://localhost:4173 >/dev/null && break
            sleep 1
          done

      - name: Run Playwright
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:4173
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  docker-build:
    name: Docker · compose build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          cp .env.example .env
          docker compose build
